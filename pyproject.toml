[project]
name = "audioctl"
version = "0.1.0"
description = "Lightweight PipeWire audio profile manager."
authors = [{name = "audioctl contributors"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["tomli>=2.0.0", "tomli-w>=1.0.0"]

[project.scripts]
audioctl = "audioctl.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
